<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Render72 · The Programme</title>
        <meta name="description" content="Campus events across code, robotics, design, stage and more. Browse the programme, filter by what you love, plan your days and register." />
        <meta name="theme-color" content="#0B0B0D" />
        <meta name="color-scheme" content="dark" />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Render72" />
        <meta property="og:title" content="Render72 · The Programme" />
        <meta property="og:description" content="Every campus event in one programme. Browse, filter, plan your days and register." />
        <meta property="og:url" content="https://render72-one.vercel.app/" />
        <meta property="og:image" content="https://render72-one.vercel.app/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Render72. Every track. Every event. Find yours." />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:image" content="https://render72-one.vercel.app/og-image.png" />

        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="/fonts/jetbrains-mono-subset.woff2" as="font" type="font/woff2" crossorigin />
        <!-- Start downloading the programme while the app's code loads, instead of after. -->
        <link rel="preload" href="https://render72.pages.dev/api/test/events" as="fetch" crossorigin="anonymous" />
        <link rel="preconnect" href="https://render72.pages.dev" crossorigin />
        <link rel="preconnect" href="https://images.pexels.com" />
    </head>
    <body>
        <div id="root">
            <!-- Drawn before any JavaScript runs, so the first paint is the site, not a blank screen.
                 React replaces all of this as soon as it starts. Same shapes as the real header. -->
            <div class="flex min-h-dvh flex-col" aria-busy="true">
                <header class="page-gutter sticky top-0 z-40 border-b border-line/60 bg-ink/85">
                    <div class="mx-auto flex h-16 max-w-[1440px] items-center justify-between gap-4">
                        <a href="/" class="inline-flex shrink-0 items-center gap-1.5" aria-label="Render72, back to the programme">
                            <span class="condensed text-[1.375rem] leading-none font-extrabold tracking-tight">Render</span>
                            <span class="tabular rounded-[5px] bg-signal px-1.5 py-0.5 text-[0.8125rem] leading-none font-bold text-bone">72</span>
                        </a>
                        <a href="/events" class="text-sm font-medium text-ash">All events</a>
                    </div>
                </header>
                <div class="page-gutter flex-1">
                    <div class="mx-auto max-w-[1440px] space-y-6 pt-16">
                        <div class="skeleton h-4 w-56 rounded-md"></div>
                        <div class="skeleton h-20 w-full max-w-3xl rounded-xl"></div>
                        <div class="skeleton h-20 w-2/3 max-w-2xl rounded-xl"></div>
                    </div>
                </div>
            </div>
        </div>
        <noscript>
            <p style="font-family:system-ui;padding:2rem;color:#F2EEE6;background:#0B0B0D;">
                Render72 needs JavaScript to load the event programme.
            </p>
        </noscript>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
